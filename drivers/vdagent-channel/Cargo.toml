[package]
name = "vdagent-channel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
guest = []
[[bin]]
name = "VDAgentChannel"
path = "src/main.rs"
required-features = ["guest"]
test = false
bench = false

[dependencies]
mac-abi.workspace = true
mac-driver = { path = "../../crates/mac-driver" }
mac-byte-channel.workspace = true
mac-virtio-console.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
spinning_top = "=0.2.5"

[build-dependencies]
mac-build.workspace = true
