[alias]
xtask = "run --package xtask --"

# Cargo keeps its own target directory. The build does not redirect it, so
# `target/` beside the checkout is what a warm build reuses.

# The target name selects the LP64 ABI; the complete profile selects the ISA.
[target.riscv64imac-unknown-none-elf]
rustflags = ["-C", "target-feature=+rva23u64", "-C", "relocation-model=pic"]
