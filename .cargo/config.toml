[alias]
xtask = "run --package xtask --"

# Cargo keeps its own target directory. The build does not redirect it, so
# `target/` beside the checkout is what a warm build reuses.

# No target rustflags here on purpose. The guest's instruction-set profile and
# relocation model are facts about the platform, so they live in the platform
# record and `cargo xtask` passes them to the guest build as a `--config`
# argument scoped to the guest triple. A static copy in this file would be a
# second source of truth: editing the record would change nothing, silently.
