[workspace]
resolver = "3"
exclude = ["vendor/skrifa", "vendor/ab_glyph_rasterizer"]
members = [
    "crates/mac-abi",
    "crates/sr-event-async",
    "crates/sr-event-dispatch",
    "crates/mac-control-model",
    "crates/mac-control-state",
    "crates/mac-bootloader",
    "crates/mac-devicetree",
    "crates/mac-definition",
    "crates/sr-control-reflow-handling",
    "crates/sr-files-list",
    "crates/mac-definition-macros",
    "crates/mac-module",
    "crates/mac-scheduler-interface",
    "crates/mac-scheduler-policy",
    "crates/mac-object-table",
    "crates/mac-kernel-model",
    "crates/mac-riscv-pages",
    "crates/mac-aarch64-pages",
    "crates/mac-fork-file",
    "crates/mac-host-protocol",
    "crates/mac-vdagent-protocol",
    "crates/mac-host-clipboard",
    "crates/mac-virtio-console",
    "crates/mac-byte-channel",
    "crates/mac-scrap-extension-interface",
    "crates/mac-file-types",
    "crates/mac-driver",
    "crates/mac-driver-alloc",
    "crates/mac-device-interface",
    "crates/mac-power-interface",
    "crates/mac-video-interface",
    "crates/mac-wave-interface",
    "crates/mac-pool-interface",
    "crates/mac-entropy-interface",
    "crates/mac-input-interface",
    "crates/mac-interrupt-interface",
    "crates/mac-filesystem-interface",
    "crates/mac-file-source-interface",
    "crates/mac-sit",
    "crates/mac-toolbox",
    "crates/mac-traps",
    "crates/mac-formats",
    "crates/mac-code-resource",
    "crates/mac-text",
    "crates/mac-hfs",
    "crates/mac-block",
    "crates/mac-sdhci",
    "crates/mac-hfs-b",
    "crates/mac-filesystem",
    "crates/mac-boot-screen",
    "crates/mac-videocore-fb",
    "toolbox/*",
    "system",
    "apps/finder",
    "apps/*",
    "vendor/shelly",
    "tools/mac-build",
    "tools/mac-extract",
    "tools/mac-fonts",
    "tools/extract-list",
    "tools/hfs-b",
    "tools/risc-forks",
    "tools/risc-host",
    "tools/xtask",
    "bootrom-riscv",
    "bootrom-aarch64",
    "bootrom-aarch64-virt",
    "definitions/*",
    "drivers/*",
    "extensions/*",
]
default-members = ["crates/mac-abi", "crates/mac-toolbox", "crates/mac-formats", "crates/mac-hfs", "tools/mac-build", "tools/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sr-event-async = { path = "crates/sr-event-async" }
sr-event-dispatch = { path = "crates/sr-event-dispatch" }
mac-aarch64-pages = { path = "crates/mac-aarch64-pages" }
mac-bootloader = { path = "crates/mac-bootloader" }
mac-host-clipboard = { path = "crates/mac-host-clipboard" }
mac-vdagent-protocol = { path = "crates/mac-vdagent-protocol" }
mac-virtio-console = { path = "crates/mac-virtio-console" }
mac-byte-channel = { path = "crates/mac-byte-channel" }
mac-scrap-extension-interface = { path = "crates/mac-scrap-extension-interface" }
mac-riscv-pages = { path = "crates/mac-riscv-pages" }
mac-kernel-model = { path = "crates/mac-kernel-model" }
mac-definition = { path = "crates/mac-definition" }
sr-control-reflow-handling = { path = "crates/sr-control-reflow-handling" }
sr-files-list = { path = "crates/sr-files-list" }
mac-file-types = { path = "crates/mac-file-types" }
mac-module = { path = "crates/mac-module" }
mac-scheduler-interface = { path = "crates/mac-scheduler-interface" }
mac-scheduler-policy = { path = "crates/mac-scheduler-policy" }
mac-device-interface = { path = "crates/mac-device-interface" }
mac-power-interface = { path = "crates/mac-power-interface" }
mac-video-interface = { path = "crates/mac-video-interface" }
mac-wave-interface = { path = "crates/mac-wave-interface" }
mac-pool-interface = { path = "crates/mac-pool-interface" }
mac-entropy-interface = { path = "crates/mac-entropy-interface" }
mac-input-interface = { path = "crates/mac-input-interface" }
mac-interrupt-interface = { path = "crates/mac-interrupt-interface" }
mac-filesystem-interface = { path = "crates/mac-filesystem-interface" }
mac-file-source-interface = { path = "crates/mac-file-source-interface" }
mac-sit = { path = "crates/mac-sit" }
mac-object-table = { path = "crates/mac-object-table" }
mac-traps = { path = "crates/mac-traps" }
mac-abi = { path = "crates/mac-abi" }
mac-devicetree = { path = "crates/mac-devicetree" }
mac-toolbox = { path = "crates/mac-toolbox" }
mac-formats = { path = "crates/mac-formats" }
mac-hfs = { path = "crates/mac-hfs" }
mac-block = { path = "crates/mac-block" }
mac-sdhci = { path = "crates/mac-sdhci" }
mac-hfs-b = { path = "crates/mac-hfs-b" }
mac-filesystem = { path = "crates/mac-filesystem" }
mac-boot-screen = { path = "crates/mac-boot-screen" }
mac-build = { path = "tools/mac-build" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = 2
strip = "none"

[patch.crates-io]
skrifa = { path = "vendor/skrifa" }
ab_glyph_rasterizer = { path = "vendor/ab_glyph_rasterizer" }
crossterm = { path = "vendor/shelly/platform/crossterm" }
