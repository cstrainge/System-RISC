
[package]
name = "shelly-shell"
description = "A Rust based Unix style shell with a typed and structured language syntax."
version = "0.5.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/cstrainge/shelly"

[[bin]]
name = "shelly"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
glob = "0.3.4"
heck = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reedline = { version = "0.52.1", features = ["external_printer"] }
nu-ansi-term = "0.50.3"
serde_json = "1.0.151"
supports-color = "3.0.2"
tokio = { version = "1.52.1", features = ["rt", "time", "sync", "io-util", "fs", "macros"] }
unicode-width = "0.2.2"

[target.'cfg(not(target_os = "systemrisc"))'.dependencies]
color_quant = "1.1"
corosensei = "0.3.4"
futures-util = "0.3.32"
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
hostname = "0.4.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.7"
tokio-util = { version = "0.7.18", features = ["io"] }
tokio = { version = "1.52.1", features = ["net"] }

[target.'cfg(target_os = "systemrisc")'.dependencies]
corosensei = { version = "0.3.4", default-features = false }
mac-toolbox = { path = "../../crates/mac-toolbox" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", features = ["process"] }

[build-dependencies]
chrono = "0.4.45"
mac-build = { path = "../../tools/mac-build" }

