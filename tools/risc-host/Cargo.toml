[package]
name = "risc-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
mac-host-protocol = { path = "../../crates/mac-host-protocol" }
mac-object-table.workspace = true
mac-hfs-b.workspace = true
cap-std = "=4.0.3"
getrandom = "=0.3.4"
sha2.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
[target.'cfg(target_os = "macos")'.dependencies]
kqueue = "=1.2.1"
libc = "=0.2.191"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
