[package]
name = "bootrom-aarch64"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bootrom-aarch64"
path = "src/main.rs"
test = false
bench = false

[dependencies]
mac-block.workspace = true
mac-boot-screen.workspace = true
mac-devicetree.workspace = true
mac-filesystem.workspace = true
mac-hfs.workspace = true
mac-sdhci.workspace = true
# Path, not workspace: the crate has no workspace entry (the kernel driver
# declares it the same way). The bootloader consumes the mailbox property
# messages; it does not re-implement them.
mac-videocore-fb = { path = "../crates/mac-videocore-fb" }
linked_list_allocator = "0.10"

[build-dependencies]
mac-build.workspace = true
serde_json.workspace = true