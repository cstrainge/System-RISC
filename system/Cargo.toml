[package]
name = "mac-system"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
guest = []
event-trace = []
emergency-qualification = []
emergency-qualification-oom = ["emergency-qualification"]
test-support = ["dep:mac-definition", "dep:mac-driver", "dep:mac-traps", "dep:toolbox-quickdraw"]

[[bin]]
name = "System"
required-features = ["guest"]
path = "src/main.rs"
test = false
bench = false

[dependencies]
mac-file-types.workspace = true
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.6.0", default-features = false }
mac-module.workspace = true
mac-scrap-extension-interface.workspace = true
mac-device-interface.workspace = true
mac-power-interface.workspace = true
mac-object-table.workspace = true
mac-kernel-model.workspace = true
mac-riscv-pages.workspace = true
spinning_top = "=0.2.5"
mac-abi.workspace = true
mac-boot-screen.workspace = true
mac-formats.workspace = true
mac-hfs.workspace = true
mac-hfs-b.workspace = true
mac-filesystem.workspace = true
mac-filesystem-interface.workspace = true
mac-file-source-interface.workspace = true
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"] }
ab_glyph_rasterizer = { version = "0.1.10", default-features = false, features = ["libm"] }
libm = "0.2"
minipng = { version = "=1.0.0", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false }
skrifa = { version = "0.48.0", default-features = false, features = ["libm"] }


[build-dependencies]
mac-build.workspace = true

[dev-dependencies]
mac-definition.workspace = true
unicode-segmentation = "=1.13.3"
mac-build.workspace = true
mac-toolbox.workspace = true
toolbox-controls = { path = "../toolbox/controls" }
toolbox-files = { path = "../toolbox/files" }
toolbox-resources = { path = "../toolbox/resources" }
toolbox-quickdraw = { path = "../toolbox/quickdraw" }
mac-traps.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
spin = { version = "=0.12.3", default-features = false, features = ["once"] }
linked_list_allocator = "0.10"

[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-driver = { path = "../crates/mac-driver", optional = true }
mac-definition = { workspace = true, optional = true }
mac-traps = { workspace = true, optional = true }
toolbox-quickdraw = { path = "../toolbox/quickdraw", optional = true }
