[package]
name = "mac-system"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
guest = []
event-trace = []
# Debug-only: Command+Option+Shift+R toggles the reported screen size.
display-event-debug = []
emergency-qualification = []
emergency-qualification-oom = ["emergency-qualification"]

[[bin]]
name = "System"
required-features = ["guest"]
path = "src/main.rs"
test = false
bench = false

[dependencies]
mac-control-model = { path = "../crates/mac-control-model" }
mac-control-state = { path = "../crates/mac-control-state" }
mac-definition.workspace = true
mac-file-types.workspace = true
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.6.0", default-features = false }
mac-module.workspace = true
mac-scrap-extension-interface.workspace = true
mac-scheduler-interface.workspace = true
mac-device-interface.workspace = true
mac-power-interface.workspace = true
mac-video-interface.workspace = true
mac-entropy-interface.workspace = true
mac-object-table.workspace = true
mac-kernel-model.workspace = true
spinning_top = "=0.2.5"
mac-abi.workspace = true
mac-devicetree.workspace = true
sr-control-reflow-handling.workspace = true
mac-boot-screen.workspace = true
mac-formats.workspace = true
mac-hfs.workspace = true
mac-hfs-b.workspace = true
mac-filesystem.workspace = true
mac-filesystem-interface.workspace = true
mac-file-source-interface.workspace = true
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"] }
ab_glyph_rasterizer = { version = "0.1.10", default-features = false, features = ["libm"] }
libm = "0.2"
minipng = { version = "=1.0.0", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false }
skrifa = { version = "0.48.0", default-features = false, features = ["libm"] }


[build-dependencies]
mac-build.workspace = true

# Bare metal on any architecture: both guest targets report target_os = "none",
# while the host does not. Cargo cannot see the custom `systemrisc` cfg, so this
# is the built-in that distinguishes one guest build from another.
# Exactly one descriptor encoder per target. Declaring both would make the
# aarch64 build compile and link the RISC-V crate, so a change there could break
# a target that never uses it.
[target.'cfg(target_arch = "riscv64")'.dependencies]
mac-riscv-pages.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
mac-aarch64-pages.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
hashbrown = { version = "=0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
spin = { version = "=0.12.3", default-features = false, features = ["once"] }
linked_list_allocator = "0.10"
