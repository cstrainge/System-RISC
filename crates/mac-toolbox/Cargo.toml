[package]
name = "mac-toolbox"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
toolbox-power = { path = "../../toolbox/power" }
toolbox-inspection = { path = "../../toolbox/inspection" }
toolbox-drag = { path = "../../toolbox/drag" }
toolbox-standard-file = { path = "../../toolbox/standard-file" }
toolbox-processes = { path = "../../toolbox/processes" }
mac-abi.workspace = true
mac-traps.workspace = true
toolbox-quickdraw = { path = "../../toolbox/quickdraw" }
toolbox-windows = { path = "../../toolbox/windows" }
toolbox-textedit = { path = "../../toolbox/textedit" }
toolbox-scrap = { path = "../../toolbox/scrap" }
toolbox-events = { path = "../../toolbox/events" }
toolbox-resources = { path = "../../toolbox/resources" }
toolbox-files = { path = "../../toolbox/files" }
toolbox-memory = { path = "../../toolbox/memory" }
toolbox-menus = { path = "../../toolbox/menus" }
toolbox-controls = { path = "../../toolbox/controls" }
toolbox-crashes = { path = "../../toolbox/crashes" }
toolbox-dialogs = { path = "../../toolbox/dialogs" }

[target.'cfg(not(target_arch = "riscv64"))'.dev-dependencies]
mac-host-clipboard.workspace = true
mac-vdagent-protocol.workspace = true
mac-power-interface.workspace = true
mac-system = { path = "../../system", features = ["test-support"] }
serde_json.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde-json-core = { version = "=0.6.0", default-features = false }
mac-formats.workspace = true
mac-module.workspace = true
mac-code-resource = { path = "../mac-code-resource" }
mac-build.workspace = true
mac-text = { path = "../mac-text" }
disc-v = { version = "=0.1.3", default-features = false }
mac-hfs-b = { path = "../mac-hfs-b" }
mac-block.workspace = true
hfs-b = { path = "../../tools/hfs-b" }
spinning_top = "=0.2.5"
unicode-segmentation = "=1.13.3"
