[package]
name = "toolbox-driver-abandon"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
no-ack = []
reply = []
[[bin]]
name = "ModuleAbandon"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "src/package.rs"
test = false
bench = false
[dependencies]
mac-abi = { path = "../../../../mac-abi" }
mac-driver = { path = "../../../../mac-driver" }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
