[package]
name = "toolbox-vdagent-transport-probe"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
private-text = []
[[bin]]
name = "VDAgentTransportProbe"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "src/package.rs"
test = false
bench = false
[dependencies]
mac-abi = { path = "../../../../mac-abi" }
mac-driver = { path = "../../../../mac-driver" }
mac-byte-channel = { path = "../../../../mac-byte-channel" }
mac-vdagent-protocol = { path = "../../../../mac-vdagent-protocol" }
mac-host-clipboard = { path = "../../../../mac-host-clipboard" }
linked_list_allocator = { version = "=0.10.6", default-features = false, features = ["use_spin"] }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
