[package]
name = "toolbox-driver-client"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
scheduler = ["dep:mac-driver-alloc", "dep:mac-scheduler-interface", "dep:mac-module"]
workers = ["dep:mac-driver-alloc"]
workers-rollback = ["workers"]
pressure = ["workers"]
[[bin]]
name = "ModuleClient"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "src/package.rs"
test = false
bench = false
[dependencies]
mac-module = { path = "../../../../mac-module", optional = true }
mac-scheduler-interface = { path = "../../../../mac-scheduler-interface", optional = true }
mac-driver = { path = "../../../../mac-driver" }
mac-abi = { path = "../../../../mac-abi" }
mac-driver-alloc = { path = "../../../../mac-driver-alloc", optional = true }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-formats = { path = "../../../../mac-formats" }
mac-build = { path = "../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
