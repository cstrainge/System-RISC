[package]
name = "toolbox-std-application"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "StdProbe"
path = "src/main.rs"
test = false
bench = false

[dependencies]
mac-toolbox = { path = "../../.." }

[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
