[package]
name = "toolbox-driver-provider"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
scheduler-deny = ["scheduler", "dep:spin"]
scheduler-malformed = ["scheduler"]
scheduler-no-defer = ["scheduler"]
scheduler = ["dep:mac-driver-alloc", "dep:mac-scheduler-interface", "dep:mac-module", "dep:mac-scheduler-policy"]
workers = []
pressure = ["dep:mac-filesystem-interface"]
[[bin]]
name = "ModuleEcho"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "src/package.rs"
test = false
bench = false
[dependencies]
spin = { version = "=0.12.3", default-features = false, features = ["once"], optional = true }
mac-module = { path = "../../../../mac-module", optional = true }
mac-scheduler-interface = { path = "../../../../mac-scheduler-interface", optional = true }
mac-scheduler-policy = { path = "../../../../mac-scheduler-policy", optional = true }
mac-driver-alloc = { path = "../../../../mac-driver-alloc", optional = true }
mac-driver = { path = "../../../../mac-driver" }
mac-abi = { path = "../../../../mac-abi" }
mac-filesystem-interface = { path = "../../../../mac-filesystem-interface", optional = true }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-formats = { path = "../../../../mac-formats" }
mac-build = { path = "../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
