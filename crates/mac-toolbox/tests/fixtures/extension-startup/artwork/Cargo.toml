[package]
name = "toolbox-extension-startup-artwork"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"
[workspace]
[features]
refusal = []
default = []
[[bin]]
name = "StartupStripProbe"
path = "../main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "../package.rs"
test = false
bench = false
[dependencies]
mac-driver = { path = "../../../../../mac-driver" }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-build = { path = "../../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
