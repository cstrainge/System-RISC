[package]
name = "toolbox-file-source-provider"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[[bin]]
name = "FileSourceProvider"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "package"
path = "src/package.rs"
test = false
bench = false
[dependencies]
mac-driver = { path = "../../../../mac-driver" }
mac-filesystem-interface = { path = "../../../../mac-filesystem-interface" }
spinning_top = { version = "0.2.5", default-features = false }
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[build-dependencies]
mac-build = { path = "../../../../../tools/mac-build" }
[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
