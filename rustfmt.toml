
edition = "2021"
style_edition = "2024"
unstable_features = true
use_small_heuristics = "Max"

newline_style = "Unix"
normalize_comments = false
normalize_doc_attributes = false
remove_nested_parens = true
reorder_impl_items = true
group_imports = "StdExternalCrate"
reorder_modules = false
trailing_comma = "Never"
trailing_semicolon = true
type_punctuation_density = "Wide"
use_field_init_shorthand = true
use_try_shorthand = true
where_single_line = false
wrap_comments = true

skip_macro_invocations = [ "lazy_static", "thread_local" ]

empty_item_single_line = false

space_before_colon = false
space_after_colon = true
spaces_around_ranges = false

format_code_in_doc_comments = true
format_generated_files = true
format_macro_bodies = true
format_strings = true

imports_granularity = "Crate"

hex_literal_case = "Lower"

hard_tabs = false
tab_spaces = 4

brace_style = "AlwaysNextLine"
control_brace_style = "AlwaysNextLine"
force_multiline_blocks = true

# fn_brace_style = "AlwaysNextLine"
# fn_args_layout = "Compressed"
fn_params_layout = "Compressed"
fn_single_line = false

force_explicit_abi = true

# bin_op_separator = "Front"

max_width = 100
# array_width = 100
# chain_width = 100
# fn_call_width = 100
# single_line_if_else_max_width = 100
comment_width = 100
enum_discrim_align_threshold = 100
struct_field_align_threshold = 100
struct_lit_width = 0
doc_comment_code_block_width = 100
inline_attribute_width = 0
short_array_element_width_threshold = 100

combine_control_expr = false

blank_lines_lower_bound = 0
blank_lines_upper_bound = 3

imports_indent = "Visual"
imports_layout = "Mixed"

indent_style = "Visual"

condense_wildcard_suffixes = false
struct_lit_single_line = false

match_arm_blocks = true
# match_arm_forces_new_line = true
match_arm_leading_pipes = "Preserve"
match_block_trailing_comma = false

merge_derives = true
